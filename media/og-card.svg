<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Warm cream base with subtle vertical wash -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F3EDE0"/>
    </linearGradient>

    <!-- Teal mesh — soft cyan to deep teal for the polygon overlays -->
    <linearGradient id="mesh1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22B8A5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#11766A" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="mesh2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9EE3D6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22B8A5" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="meshBL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22B8A5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9EE3D6" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Soft glow behind shield -->
    <radialGradient id="shieldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22B8A5" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#22B8A5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22B8A5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top-right polygon mesh cluster (echoes the LinkedIn banner) -->
  <g opacity="0.85">
    <polygon points="900,0 1200,0 1200,180 1050,80" fill="url(#mesh1)"/>
    <polygon points="1050,80 1200,180 1200,300 950,200" fill="url(#mesh2)"/>
    <polygon points="780,0 900,0 1050,80 870,140" fill="url(#mesh2)"/>
    <polygon points="870,140 1050,80 950,200 800,180" fill="url(#mesh1)"/>
    <polygon points="950,200 1200,300 1200,400 1000,330" fill="url(#mesh2)"/>
  </g>

  <!-- Bottom-left polygon mesh cluster (counterweight) -->
  <g opacity="0.75">
    <polygon points="0,470 200,520 0,630" fill="url(#meshBL)"/>
    <polygon points="0,630 200,520 320,580 220,630" fill="url(#mesh1)"/>
    <polygon points="200,520 320,580 380,490 260,460" fill="url(#meshBL)"/>
  </g>

  <!-- Connecting circuit lines (LinkedIn-banner motif) -->
  <g stroke="#22B8A5" stroke-width="1.5" fill="none" opacity="0.45">
    <path d="M 760 90 L 900 90 L 920 70 L 1010 70"/>
    <path d="M 700 240 L 820 240 L 840 220 L 960 220"/>
    <path d="M 240 540 L 360 540 L 380 520 L 460 520"/>
  </g>
  <g fill="#22B8A5" opacity="0.55">
    <circle cx="760" cy="90" r="4"/>
    <circle cx="1010" cy="70" r="4"/>
    <circle cx="700" cy="240" r="4"/>
    <circle cx="960" cy="220" r="4"/>
    <circle cx="240" cy="540" r="4"/>
    <circle cx="460" cy="520" r="4"/>
  </g>

  <!-- Shield glow halo -->
  <circle cx="200" cy="315" r="170" fill="url(#shieldGlow)"/>

  <!-- Eyebrow — mono uppercase, top-left -->
  <text x="80" y="80"
        font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace"
        font-size="14" font-weight="500" letter-spacing="3.2"
        fill="#11766A">
    EIAAW &#183; 2026
  </text>
  <line x1="80" y1="92" x2="120" y2="92" stroke="#11766A" stroke-width="1" opacity="0.5"/>

  <!-- Wordmark block (right of shield) -->
  <g transform="translate(360, 240)">
    <text x="0" y="0"
          font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="72" font-weight="800" letter-spacing="-1.5"
          fill="#0F1A1D">EIAAW SOLUTIONS</text>

    <text x="0" y="48"
          font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace"
          font-size="20" font-weight="500" letter-spacing="3.6"
          fill="#11766A">AI &#183; HUMAN PARTNERSHIPS</text>

    <!-- Tagline — Inter regular + serif italic accent -->
    <text x="0" y="130"
          font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="34" font-weight="400" fill="#2A3438">
      Ethical AI that <tspan
        font-family="'Instrument Serif', 'Times New Roman', Georgia, serif"
        font-style="italic" font-weight="400" fill="#11766A">amplifies</tspan> the people
    </text>
    <text x="0" y="178"
          font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="34" font-weight="400" fill="#2A3438">
      doing the work.
    </text>
  </g>

  <!-- Footer rule -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#D9CFBC" stroke-width="1"/>

  <!-- Footer left — locations -->
  <text x="80" y="595"
        font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace"
        font-size="13" font-weight="500" letter-spacing="2.6"
        fill="#6B7A7F">
    KUALA LUMPUR &#183; SINGAPORE
  </text>

  <!-- Footer right — URL -->
  <text x="1120" y="595" text-anchor="end"
        font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace"
        font-size="13" font-weight="500" letter-spacing="2.6"
        fill="#11766A">
    EIAAWSOLUTIONS.COM
  </text>
</svg>
